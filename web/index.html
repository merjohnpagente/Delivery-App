<!DOCTYPE html>
<html>
<head>
  <!--
    Bings web bootstrap. Generated for `flutter build web`.
    1. Replace YOUR_MAPS_API_KEY below with a key that has
       "Maps JavaScript API" + "Directions API" enabled.
    2. Run `flutterfire configure` to fill the real Firebase web
       values in lib/firebase_options.dart.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bings - Food Delivery App. Browse foods, cart, checkout, live rider tracking.">
  <meta name="theme-color" content="#ff5722">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bings">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Bings - Food Delivery</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS API (required by google_maps_flutter on web) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #fff7f2; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      gap: 14px; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #ff5722; font-weight: 700; }
    #loading .box { width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #ff5722, #ff8a50);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 32px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <div id="loading"><div class="box">B</div><span>Loading Bings...</span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
