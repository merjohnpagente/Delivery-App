name: Build Dodo food APK

# Runs ONLY after the web deploy succeeds (live first, APK second).
# Manual runs still possible via "Run workflow".
on:
  workflow_run:
    workflows: ["Deploy Dodo food Web to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Skip when triggered by a failed/cancelled web deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk bings-app.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bings-app
          path: bings-app.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dodo food latest build
          body: |
            Download and install **bings-app.apk** on your Android phone.
            Built automatically after the website deploys green.
          files: bings-app.apk
