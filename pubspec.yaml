name: Bings
description: BINGS - Food Delivery App UI in Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.15.0
  firebase_storage: ^11.5.0
  google_sign_in: ^6.1.0
  geolocator: ^10.1.0
  http: ^1.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/about.png
    - assets/images/avatar.jpg
    - assets/images/biryani.png
    - assets/images/bitcoin-logo.png
    - assets/images/burger.png
    - assets/images/cover-image.png
    - assets/images/cryptocurrency.png
    - assets/images/drink.png
    - assets/images/gift.png
    - assets/images/idea.png
    - assets/images/job.png
    - assets/images/letter-l.png
    - assets/images/mcqs.png
    - assets/images/notification.png
    - assets/images/paragraph.png
    - assets/images/pastpapers.png
    - assets/images/pdf.png
    - assets/images/pizza.png
    - assets/images/Product 1.png
    - assets/images/Product 2.png
    - assets/images/Product 3.png
    - assets/images/Product 4.png
    - assets/images/purse.png
    - assets/images/quiz.png
    - assets/images/ripple.png
    - assets/images/salan.png
    - assets/images/teamwork.png
    - assets/images/thumb-up.png
    - assets/images/woman.png

# App icon: vector source is assets/icon/app_icon.svg (crisp at any size).
# PNG master + Android mipmaps are pre-generated and committed.
# Regenerate locally with: dart run flutter_launcher_icons
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
